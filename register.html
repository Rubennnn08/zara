<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Crear cuenta</title>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="menu.css">

  <style>
    :root{
      --bg:#fff;
      --text:#111;
      --muted:#666;
      --hair:rgba(17,17,17,.18);
      --letter:.14em;
      --max:1180px;
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      padding-top:130px; /* desktop */
      font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    a{ color:inherit; text-decoration:none; }
    ul{ list-style:none; padding:0; margin:0; }

    /* =========================
       FORMATO ZARA (contenido)
       ========================= */
    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 18px 14px 64px;
    }

    .section-title{
      border-top:1px solid var(--hair);
      padding-top:14px;
      margin-top:10px;
    }
    .section-title h5{
      margin:0;
      font-size:14px;
      font-weight:600;
      letter-spacing:var(--letter);
      text-transform:uppercase;
    }

    .formholder{
      margin-top:14px;
      max-width: 820px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 900px){
      .formholder{ grid-template-columns: 1fr 1fr; gap: 26px; }
    }

    .rightside{
      border-top:1px solid var(--hair);
      padding-top:14px;
    }

    form{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"]{
      width:100%;
      border:none;
      outline:none;
      border-bottom:1px solid #111;
      padding:10px 2px 8px;
      background:#fff;
      font-size:12px;
      letter-spacing:var(--letter);
      text-transform:uppercase;
    }

    /* Teléfono +34 */
    #phone1{
      display:flex;
      align-items:flex-end;
      gap:10px;
    }
    #phone1 span{
      font-size:12px;
      letter-spacing:var(--letter);
      text-transform:uppercase;
      padding-bottom:8px;
      white-space:nowrap;
    }
    #phone{
      width:100%;
    }

    /* Checkboxes */
    .checks{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top: 8px;
      border-top:1px solid var(--hair);
      padding-top:12px;
    }
    .checkline{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .checkline input{ margin-top: 2px; }
    .checkline span{
      font-size:11px;
      color:#222;
      letter-spacing:.04em;
      line-height:1.4;
    }

    /* Botones */
    .btn{
      width:100%;
      height:42px;
      border:1px solid #111;
      background:#fff;
      color:#111;
      cursor:pointer;
      font-size:12px;
      letter-spacing:var(--letter);
      text-transform:uppercase;
    }
    .btn.primary{
      background:#111;
      color:#fff;
    }

    /* Loader SweetAlert */
    .custom-loader {
      width: 50px;
      height: 50px;
      position: relative;
      margin: 20px auto 0;
    }
    .custom-loader::before,
    .custom-loader::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #000;
      animation: spin 1s linear infinite;
    }
    .custom-loader::after {
      border-top-color: #555;
      animation-delay: 0.15s;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .swal2-title {
      font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: var(--letter);
      text-transform: uppercase;
    }

    /* Columna derecha */
    .ghost{
      display:none;
      border-top:1px solid var(--hair);
      padding-top:14px;
      color:var(--muted);
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      line-height:1.6;
    }
    @media (min-width: 900px){
      .ghost{ display:block; }
    }

    /* =========================
       NAVBAR (base)
       ========================= */
    .navbar1{
      position:fixed; top:0; left:0; right:0;
      height:130px;
      background:#fff;
      border-bottom:1px solid var(--hair);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      z-index:50;
    }
    .navbar1 #menu{ width:28px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
    .navbar1 .bar{ height:2px; background:#111; width:100%; display:block; }
    .navbar1 .logo img{ height:54px; display:block; }
    .navbar1 .searchbar input{
      width:min(420px, 42vw);
      border:none;
      border-bottom:1px solid var(--hair);
      outline:none;
      padding:10px 8px;
      font-size:12px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .navbar1 .help{
      display:flex;
      gap:14px;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    /* ✅ NAVBAR COMPLETO EN MÓVIL (2 FILAS) */
    @media (max-width: 900px){
      body{ padding-top:160px; } /* espacio extra porque el navbar crece */

      .navbar1{
        height:auto;              /* deja crecer */
        padding:10px 14px;
        flex-wrap:wrap;           /* permite 2 filas */
        gap:10px;
      }

      /* 1ª fila: menú + logo + buscador */
      .navbar1 #menu{ order:1; }
      .navbar1 .logo{ order:2; }
      .navbar1 .searchbar{
        order:3;
        flex:1 1 100%;
      }
      .navbar1 .searchbar input{
        width:100%;
        max-width:none;
      }

      /* 2ª fila: enlaces visibles (scroll horizontal) */
      .navbar1 .help{
        order:4;
        display:flex !important;
        width:100%;
        gap:16px;
        overflow-x:auto;
        padding-bottom:6px;
        -webkit-overflow-scrolling:touch;
      }
      .navbar1 .help a{ flex:0 0 auto; }
    }

    @media (max-width: 420px){
      .navbar1 .logo img{ height:46px; }
      .navbar1 .help{ font-size:10px; gap:12px; }
    }

    /* =========================
       ✅ CHAT ASSISTANT (FLOAT)
       ========================= */
    #assistant-button{
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111;
      color: #fff;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999999;
      user-select:none;
    }
    #assistant-chat{
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 320px;
      background: #fff;
      border: 1px solid #111;
      z-index: 999999;
      box-shadow: 0 10px 30px rgba(0,0,0,.12);
    }
    .hidden{ display:none; }

    .chat-header{
      background:#111;
      color:#fff;
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:12px;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    #close-chat{ cursor:pointer; padding-left:10px; }

    #chat-messages{
      height: 230px;
      padding: 10px 12px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
    }
    #chat-input{
      width:100%;
      padding: 12px;
      border: none;
      border-top: 1px solid rgba(17,17,17,.25);
      outline:none;
      font-size: 12px;
      letter-spacing:.04em;
    }
    .msg-user{ margin: 6px 0; }
    .msg-bot{ margin: 6px 0; }
  </style>
</head>

<body>

  <!-- ✅ BOTÓN FLOTANTE DEL ASISTENTE -->
  <div id="assistant-button" aria-label="Abrir asistente">💬</div>

  <!-- ✅ VENTANA DEL CHAT -->
  <div id="assistant-chat" class="hidden">
    <div class="chat-header">
      ZARA Style Assistant
      <span id="close-chat" aria-label="Cerrar">✕</span>
    </div>
    <div id="chat-messages"></div>
    <input id="chat-input" placeholder="Escribe tu pregunta..." />
  </div>

  <!-- NAVBAR -->
  <div class="navbar1">
      <div id="menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
      </div>
      <div class="logo"><a href="./RP.html"><img src="logo.png" alt="Logo"></a></div>
      <div class="searchbar"><input type="text" placeholder="Buscar" id="search"></div>
      <div class="help">
          <a href="./login.html">INICIAR SESIÓN</a>
          <a href="./help.html">AYUDA</a>
          <a href="./help.html">CESTA [0]</a>
          <a href="./MYPLNAER.html">MY PLANER</a>
          <a href="./Agenda.html">AGENDA</a>
      </div>
  </div>

  <!-- CONTENIDO -->
  <main class="wrap">
    <div class="section-title">
      <h5>Datos personales</h5>
    </div>

    <div class="formholder">
      <section class="rightside">
        <form id="form1">
          <input type="email" placeholder="E-mail" id="mail" required>
          <input type="password" placeholder="Contraseña" id="pass" required>
          <input type="text" placeholder="Nombre" id="name" required>
          <input type="text" placeholder="Apellidos" id="add">

          <div id="phone1">
            <span>+34</span>
            <input type="text" placeholder="Teléfono" id="phone" inputmode="numeric">
          </div>

          <button class="btn" type="button" onclick="window.location.href='./RP.html'">
            Crear experiencia personalizada
          </button>

          <div class="checks">
            <label class="checkline">
              <input type="checkbox" id="checkbox1">
              <span>Quiero recibir comunicaciones comerciales personalizadas de ZARA a través del email.</span>
            </label>

            <label class="checkline">
              <input type="checkbox" id="checkbox2" required>
              <span>He podido leer y entiendo la Política de Privacidad y Cookies.</span>
            </label>
          </div>

          <button class="btn primary" type="submit" id="submit">Crear cuenta</button>
        </form>
      </section>

      <aside class="ghost">
        Completa tu cuenta para una experiencia más personalizada.
      </aside>
    </div>
  </main>

<script>
  /* =========================
     REGISTRO (TU CÓDIGO)
     ========================= */
  let loginData = JSON.parse(localStorage.getItem('regdata'));
  if (loginData == null) loginData = [];

  const logform = document.getElementById('form1');
  const logmail  = document.getElementById('mail');
  const logpass = document.getElementById('pass');
  const logname = document.getElementById('name');

  logform.addEventListener('submit', (e) => {
    e.preventDefault();

    const privacy = document.getElementById("checkbox2");
    if(!privacy.checked){
      alert("Debes aceptar la Política de Privacidad.");
      return;
    }

    const loginform = {
      mail: logmail.value,
      password: logpass.value,
      name: logname.value
    };

    loginData.push(loginform);
    localStorage.setItem('regdata', JSON.stringify(loginData));

    Swal.fire({
      title: 'Comenzando...',
      html: `<div class="custom-loader"></div>`,
      showConfirmButton: false,
      allowOutsideClick: false,
      allowEscapeKey: false
    });

    setTimeout(() => {
      window.location.href = './RP.html';
    }, 1800);
  });

  /* =========================
     ✅ CHAT ASSISTANT (CON MEMORIA)
     ========================= */
  const assistantBtn = document.getElementById("assistant-button");
  const assistantChat = document.getElementById("assistant-chat");
  const assistantClose = document.getElementById("close-chat");
  const assistantInput = document.getElementById("chat-input");
  const assistantMessages = document.getElementById("chat-messages");

  const API_URL = "https://zara-style-assistant-api-7fvc.vercel.app/api/chat";

  let chatHistory = []; // memoria local (se mantiene mientras estés en la página)

  function addMsg(type, text) {
    const div = document.createElement("div");
    div.className = type === "user" ? "msg-user" : "msg-bot";
    div.innerHTML = type === "user"
      ? `<strong>Tú:</strong> ${text}`
      : `<strong>Asistente:</strong> ${text}`;
    assistantMessages.appendChild(div);
    assistantMessages.scrollTop = assistantMessages.scrollHeight;
  }

  assistantBtn.addEventListener("click", () => {
    assistantChat.classList.toggle("hidden");
    if (!assistantChat.classList.contains("hidden")) {
      setTimeout(() => assistantInput.focus(), 50);
    }
  });

  assistantClose.addEventListener("click", () => {
    assistantChat.classList.add("hidden");
  });

  assistantInput.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;

    const userText = assistantInput.value.trim();
    if (!userText) return;

    // comando para reiniciar chat
    if (userText.toLowerCase() === "/reset") {
      assistantInput.value = "";
      chatHistory = [];
      assistantMessages.innerHTML = "";
      addMsg("bot", "Chat reiniciado ✅");
      return;
    }

    assistantInput.value = "";
    addMsg("user", userText);

    chatHistory.push({ role: "user", content: userText });

    // escribiendo...
    const typing = document.createElement("div");
    typing.className = "msg-bot";
    typing.innerHTML = `<strong>Asistente:</strong> …`;
    assistantMessages.appendChild(typing);
    assistantMessages.scrollTop = assistantMessages.scrollHeight;

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        // Mandamos ambas cosas: message (compat) + messages (memoria)
        body: JSON.stringify({ message: userText, messages: chatHistory }),
      });

      typing.remove();

      if (!response.ok) {
        addMsg("bot", "Ahora mismo no puedo responder. Revisa Vercel / API.");
        return;
      }

      const data = await response.json();
      const reply = data.reply || "No he recibido respuesta.";

      addMsg("bot", reply);
      chatHistory.push({ role: "assistant", content: reply });

    } catch (err) {
      typing.remove();
      addMsg("bot", "Error de conexión. ¿Tu API de Vercel está desplegada?");
    }
  });
</script>

</body>
</html>
