<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recomendaciones</title>

<link rel="stylesheet" href="menu.css" />

<style>
:root{
  --bg:#fff; --text:#111; --muted:#666;
  --hair:rgba(17,17,17,.18);
  --shadow:0 18px 60px rgba(0,0,0,.18);
  --letter:.14em;
  --drawerW:min(260px,36vw);
  --tabW:34px;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding-top:130px;
  background:#fff;
  color:#111;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
}
a{text-decoration:none;color:inherit}
.container{max-width:980px;margin:0 auto;padding:18px 14px 64px}

/* NAVBAR */
.navbar1{
  position:fixed;top:0;left:0;right:0;
  height:130px;background:#fff;
  border-bottom:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;z-index:50;
}
.navbar1 #menu{width:28px;display:flex;flex-direction:column;gap:6px}
.navbar1 .bar{height:2px;background:#111}
.navbar1 .logo img{height:54px}
.navbar1 .searchbar input{
  width:min(420px,42vw);
  border:none;border-bottom:1px solid var(--hair);
  padding:10px 8px;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;
}
.navbar1 .help{
  display:flex;gap:14px;
  font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;
}

/* GRID */
.grid{
  margin-top:14px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}
@media(max-width:520px){.grid{grid-template-columns:1fr}}

.media{
  position:relative;
  aspect-ratio:3/4;
  border:1px solid var(--hair);
  overflow:hidden;
  background:#000;
}
.media video{
  width:100%;height:100%;
  object-fit:cover;
  pointer-events:none;
}
.overlay{
  position:absolute;bottom:10px;left:10px;right:10px;
  display:flex;justify-content:center;
}
.overlay span{
  background:rgba(255,255,255,.9);
  border:1px solid rgba(0,0,0,.15);
  padding:8px 10px;
  font-size:11px;
  letter-spacing:var(--letter);
  text-transform:uppercase;
}

.title-under{
  margin-top:10px;
  font-size:12px;
  letter-spacing:var(--letter);
  text-transform:uppercase;
  border-bottom:1px solid var(--hair);
  padding-bottom:10px;
}
.meta{
  margin-top:6px;
  display:flex;
  justify-content:space-between;
  font-size:10px;
  color:var(--muted);
  letter-spacing:var(--letter);
  text-transform:uppercase;
}

/* LOOK DRAWER */
.look-tab{
  position:absolute;top:12px;right:12px;
  width:var(--tabW);height:92px;
  background:rgba(17,17,17,.86);
  border:1px solid rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;z-index:5;
}
.look-tab span{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-size:10px;
  letter-spacing:.22em;
}

.look-drawer{
  position:absolute;top:0;right:0;
  height:100%;width:var(--drawerW);
  background:rgba(255,255,255,.97);
  border-left:1px solid var(--hair);
  transform:translateX(100%);
  opacity:0;
  transition:.25s ease;
  z-index:6;
  display:flex;flex-direction:column;
}
.look-drawer.open{
  transform:translateX(0);
  opacity:1;
}
.ld-head{
  padding:12px;border-bottom:1px solid var(--hair);
  display:flex;justify-content:space-between;
}
.ld-head .t{
  font-size:11px;
  letter-spacing:var(--letter);
  text-transform:uppercase;
}
.ld-close{
  width:32px;height:32px;
  background:none;border:none;
  cursor:pointer;position:relative;
}
.ld-close::before,.ld-close::after{
  content:"";position:absolute;
  top:50%;left:50%;
  width:16px;height:1px;background:#111;
}
.ld-close::before{transform:translate(-50%,-50%) rotate(45deg)}
.ld-close::after{transform:translate(-50%,-50%) rotate(-45deg)}

.look-items{
  padding:10px;display:grid;gap:10px;
  overflow:auto;
}
.look-item{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:10px;
  border:1px solid var(--hair);
  padding:8px;
  cursor:pointer;
}
.look-item img{
  width:64px;height:82px;
  object-fit:cover;border:1px solid var(--hair);
}
.look-item .ref{
  font-size:10px;letter-spacing:var(--letter);
  text-transform:uppercase;
}
.look-item .name{
  font-size:11px;color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;
}

/* MODAL */
.modal{
  position:fixed;inset:0;
  background:rgba(255,255,255,.96);
  display:none;z-index:80;
}
.modal.open{display:block}
.modal-top{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-bottom:1px solid var(--hair);
  background:#fff;
}
.modal-title{
  flex:1;text-align:center;
  font-size:14px;
  letter-spacing:var(--letter);
  text-transform:uppercase;
}
.back-btn{
  border:1px solid var(--hair);
  background:#fff;
  padding:10px 12px;
  font-size:11px;
  letter-spacing:var(--letter);
  text-transform:uppercase;
  cursor:pointer;
}
.close{
  width:40px;height:40px;
  background:none;border:none;
  cursor:pointer;position:relative;
}
.close::before,.close::after{
  content:"";position:absolute;
  top:50%;left:50%;
  width:18px;height:1px;background:#111;
}
.close::before{transform:translate(-50%,-50%) rotate(45deg)}
.close::after{transform:translate(-50%,-50%) rotate(-45deg)}

.modal-content{
  max-width:980px;margin:0 auto;
  padding:16px;
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:860px){
  .modal-content{grid-template-columns:1.2fr .8fr}
}
.gallery-main{
  width:100%;
  max-height:60vh;
  object-fit:contain;
  box-shadow:var(--shadow);
}
.thumbs{
  display:flex;gap:10px;
  overflow-x:auto;
}
.thumbs button{
  width:92px;height:120px;
  border:1px solid var(--hair);
  background:#fff;padding:0;
}
.thumbs img{width:100%;height:100%;object-fit:cover}
.panel-right h2{
  margin:0 0 8px;
  font-size:16px;
  letter-spacing:var(--letter);
  text-transform:uppercase;
}
.panel-right .ref{
  font-size:12px;
  color:var(--muted);
  letter-spacing:var(--letter);
  text-transform:uppercase;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar1">
  <div id="menu"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
  <div class="logo"><img src="logo.png"></div>
  <div class="searchbar"><input placeholder="Buscar"></div>
  <div class="help">
    <a>INICIAR SESIÓN</a><a>AYUDA</a><a>CESTA [0]</a>
  </div>
</div>

<div class="container">
  <section class="grid" id="grid"></section>
</div>

<!-- MODAL -->
<section class="modal" id="modal">
  <div class="modal-top">
    <button class="back-btn" id="backBtn">VOLVER ATRÁS</button>
    <div class="modal-title" id="modalTitle">IMÁGENES</div>
    <button class="close" id="closeBtn"></button>
  </div>

  <div class="modal-content">
    <div>
      <img id="galleryMain" class="gallery-main">
      <div id="thumbs" class="thumbs"></div>
    </div>
    <aside class="panel-right">
      <h2 id="modalName">—</h2>
      <div class="ref" id="modalTag">—</div>
    </aside>
  </div>
</section>

<script>
const LOOKS=[
{
  name:"CENA FAMILIAR",
  tag:"SUGERENCIA",
  video:"video/cena.mp4",
  images:["img/relojarena1.jpg","img/relojarena2.jpg"],
  products:[
    {imgs:["img/prenda/camiseta1triangulo.png"],ref:"REF 6224/376/250",name:"CAMISETA"},
    {imgs:["img/prenda/falda1triangulo.png"],ref:"REF 5919/211/922",name:"FALDA"}
  ]
}
];

const grid=document.getElementById("grid");
const modal=document.getElementById("modal");
const galleryMain=document.getElementById("galleryMain");
const thumbs=document.getElementById("thumbs");
const modalTitle=document.getElementById("modalTitle");
const modalName=document.getElementById("modalName");
const modalTag=document.getElementById("modalTag");

grid.innerHTML=LOOKS.map(l=>`
<article>
  <div class="media">
    <video autoplay muted loop playsinline>
      <source src="${l.video}">
    </video>
    <div class="overlay"><span>VER IMÁGENES</span></div>
    <div class="look-tab">LOOK</div>
  </div>
  <div class="title-under">${l.name}</div>
  <div class="meta"><span>${l.tag}</span><span>VIDEO</span></div>
</article>
`).join("");

function openModal(images,name,tag){
  modal.classList.add("open");
  modalTitle.textContent=name;
  modalName.textContent=name;
  modalTag.textContent=tag;
  galleryMain.src=images[0];
  thumbs.innerHTML=images.map((i,idx)=>`
    <button onclick="galleryMain.src='${i}'">
      <img src="${i}">
    </button>
  `).join("");
}

grid.addEventListener("click",()=>{
  openModal(LOOKS[0].images,LOOKS[0].name,LOOKS[0].tag);
});

document.getElementById("closeBtn").onclick=closeModal;
document.getElementById("backBtn").onclick=closeModal;
modal.onclick=e=>{if(e.target===modal)closeModal()};
document.onkeydown=e=>{if(e.key==="Escape")closeModal()};

function closeModal(){
  modal.classList.remove("open");
}
</script>

</body>
</html>
