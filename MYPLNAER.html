<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recomendaciones</title>

  <link rel="stylesheet" href="menu.css" />

  <style>
    :root{
      --bg:#fff; --text:#111; --muted:#666;
      --hair:rgba(17,17,17,.18);
      --shadow:0 18px 60px rgba(0,0,0,.18);
      --letter:.14em;
    }
    *{box-sizing:border-box}

    body{
      margin:0;
      padding-top:130px;
      background:#fff;
      color:#111;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    a{color:inherit;text-decoration:none}
    .container{max-width:980px;margin:0 auto;padding:18px 14px 64px;}

    /* ================= NAVBAR (DESKTOP IGUAL) ================= */
    .navbar1{
      position:fixed; top:0; left:0; right:0;
      height:130px;
      background:#fff;
      border-bottom:1px solid var(--hair);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      z-index:50;
    }
    .navbar1 #menu{
      width:28px; cursor:pointer;
      display:flex; flex-direction:column; gap:6px;
    }
    .navbar1 .bar{ height:2px; background:#111; width:100%; }
    .navbar1 .logo img{ height:54px; }
    .navbar1 .searchbar input{
      width:min(420px, 42vw);
      border:none;
      border-bottom:1px solid var(--hair);
      outline:none;
      padding:10px 8px;
      font-size:12px;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .navbar1 .help{
      display:flex;
      gap:14px;
      font-size:11px;
      letter-spacing:.12em;
      text-transform:uppercase;
      white-space:nowrap;
    }

    /* ================= NAVBAR MÓVIL (COMPLETO) ================= */
    @media (max-width: 900px){
      body{ padding-top:160px; }

      .navbar1{
        height:auto;
        flex-wrap:wrap;
        gap:10px;
        padding:10px 14px;
      }

      /* fila 1 */
      .navbar1 #menu{ order:1; }
      .navbar1 .logo{ order:2; }
      .navbar1 .searchbar{
        order:3;
        flex:1 1 100%;
      }
      .navbar1 .searchbar input{
        width:100%;
      }

      /* fila 2 */
      .navbar1 .help{
        order:4;
        display:flex;
        width:100%;
        gap:16px;
        overflow-x:auto;
        padding-bottom:6px;
        -webkit-overflow-scrolling:touch;
      }
      .navbar1 .help a{ flex:0 0 auto; }
    }

    @media (max-width: 420px){
      .navbar1 .logo img{ height:46px; }
      .navbar1 .help{ font-size:10px; gap:12px; }
    }

    /* ================= GRID ================= */
    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }
    @media (max-width:520px){
      .grid{grid-template-columns:1fr}
    }

    .media{
      position:relative;
      aspect-ratio:3/4;
      overflow:hidden;
      border:1px solid var(--hair);
    }
    .media video{
      width:100%;
      height:100%;
      object-fit:cover;
      pointer-events:none;
    }
    .overlay{
      position:absolute; bottom:10px; left:10px; right:10px;
      display:flex; justify-content:center;
    }
    .overlay span{
      background:rgba(255,255,255,.9);
      border:1px solid rgba(0,0,0,.15);
      padding:8px 10px;
      font-size:11px;
      letter-spacing:var(--letter);
      text-transform:uppercase;
    }

    .title-under{
      margin-top:10px;
      font-size:12px;
      letter-spacing:var(--letter);
      text-transform:uppercase;
      border-bottom:1px solid var(--hair);
      padding-bottom:10px;
    }
    .meta{
      margin-top:6px;
      display:flex;
      justify-content:space-between;
      font-size:10px;
      color:var(--muted);
      letter-spacing:var(--letter);
      text-transform:uppercase;
    }

    /* ================= MODAL ================= */
    .modal{
      position:fixed;
      inset:0;
      background:rgba(255,255,255,.96);
      display:none;
      z-index:80;
    }
    .modal.open{display:block}

    .modal-top{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px;
      border-bottom:1px solid var(--hair);
      background:#fff;
    }

    .modal-content{
      max-width:980px;
      margin:0 auto;
      padding:16px;
      display:grid;
      grid-template-columns:1fr;
      gap:16px;
      max-height:calc(100vh - 70px);
      overflow-y:auto;
    }
    @media (min-width:860px){
      .modal-content{grid-template-columns:1.2fr .8fr}
    }

    .gallery{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .gallery-main{
      max-height:60vh;
      object-fit:contain;
      box-shadow:var(--shadow);
    }
    .thumbs{
      display:flex;
      gap:10px;
      overflow-x:auto;
      max-height:120px;
    }
    .thumbs button{
      width:92px;height:120px;
      border:1px solid var(--hair);
      background:#fff;
      padding:0;
    }
    .thumbs button.active{
      border-color:#111;
    }
    .thumbs img{
      width:100%;height:100%;object-fit:cover;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar1">
  <div id="menu">
    <span class="bar"></span><span class="bar"></span><span class="bar"></span>
  </div>
  <div class="logo"><a href="./RP.html"><img src="logo.png"></a></div>
  <div class="searchbar"><input placeholder="Buscar"></div>
  <div class="help">
    <a href="./login.html">INICIAR SESIÓN</a>
    <a href="./help.html">AYUDA</a>
    <a href="./help.html">CESTA [0]</a>
    <a href="./MYPLNAER.html">MY PLANNER</a>
    <a href="./Agenda.html">AGENDA</a>
  </div>
</div>

<div class="container">
  <section class="grid" id="grid"></section>
</div>

<script>
const LOOKS=[
  {name:"CENA FAMILIAR",tag:"SUGERENCIA",video:"video/cena.mp4",images:["img/relojarena1.jpg","img/relojarena2.jpg"]},
  {name:"CENA FAMILIAR",tag:"SUGERENCIA",video:"video/cena1.mp4",images:["img/relojarena2.jpg","img/relojarena1.jpg"]}
];

const grid=document.getElementById("grid");

LOOKS.forEach(item=>{
  grid.innerHTML+=`
    <article>
      <div class="media">
        <video autoplay muted loop playsinline>
          <source src="${item.video}">
        </video>
        <div class="overlay"><span>VER IMÁGENES</span></div>
      </div>
      <div class="title-under">${item.name}</div>
      <div class="meta"><span>${item.tag}</span><span>VIDEO</span></div>
    </article>
  `;
});
</script>

</body>
</html>
